[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robinevell-fallbackchain"
version = "0.1.0"
description = "沿降级链检查每级的触发条件、可用性与代价，标出断链"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "robinevell" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://robinevell.github.io"
Repository = "https://github.com/robinevell/fallbackchain"
Issues = "https://github.com/robinevell/fallbackchain/issues"

[project.scripts]
fallbackchain = "fallbackchain:main"

[tool.setuptools]
py-modules = ["fallbackchain"]
